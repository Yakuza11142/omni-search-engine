name: Build Pure C Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-pure-c:
    name: Build Native Android Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Wrapper Binary inside android/
        working-directory: ./android
        run: gradle wrapper

      - name: Grant Executable Permissions
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Pure C Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: Build Pure C Release AAB
        working-directory: ./android
        run: ./gradlew bundleRelease

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: pure-c-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Output AAB
        uses: actions/upload-artifact@v4
        with:
          name: pure-c-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
