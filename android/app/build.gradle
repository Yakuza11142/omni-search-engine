android {
    ...
    defaultConfig {
        ...
        externalNativeBuild {
            cmake {
                cppFlags ""
                // Pass the project root directory path safely to CMake
                arguments "-DPROJECT_ROOT_DIR=${rootDir.absolutePath}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1" // Or your installed NDK-supported version (e.g., 3.22.1+)
        }
    }
}
