plugins {
    id 'com.android.application'
    id 'kotlin-android' // (If using Kotlin)
}

android {
    namespace 'com.example.app'
    compileSdk 34

    defaultConfig {
        ...
        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DPROJECT_ROOT_DIR=${rootDir.absolutePath}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}
