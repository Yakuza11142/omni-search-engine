plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.app'
    compileSdk 34

    defaultConfig {
        // Ensure your targetSdk matches compileSdk
        targetSdk 34
        
        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DPROJECT_ROOT_DIR=${rootDir.absolutePath}"
            }
        }
    }
