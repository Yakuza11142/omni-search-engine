buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Ensure the Android Gradle Plugin matches your setup
        classpath 'com.android.tools.build:gradle:8.2.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.build.directory
}
